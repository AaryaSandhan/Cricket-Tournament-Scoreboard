      var go = el('<button class="btn switch-btn">' + (isFinal ? "&#127942; Crown the champion" : "Continue to bracket") + "</button>");
      go.onclick = function () {
        state.currentMatch = null;
        if (isFinal) { state.view = "champion"; render(); fireConfetti(); }
        else { state.view = "bracket"; render(); }
      };
      btns.appendChild(go);
      rc.appendChild(btns);
      if (noAnim) rc.style.animation = "none";
      var wp = el('<div class="winner-panel"></div>');
      wp.appendChild(rc);
      wrap.appendChild(wp);
    } else if (m.tied && !m.so) {
      var tc = el('<div class="result-card tie"><div class="rc-label">Match tied</div><div class="rc-name">Scores are level</div>' +
        '<div class="rc-margin">' + (m.soLog.length ? "The Super Over was tied as well. " : "") + "A Super Over will decide the winner.</div></div>");
      var tb = el('<div class="winner-buttons"></div>');
      var so = el('<button class="btn btn-ball">Start Super Over</button>');
      so.onclick = function () { startSuperOver(m); };
      tb.appendChild(so); tc.appendChild(tb);
      if (noAnim) tc.style.animation = "none";
      var wp2 = el('<div class="winner-panel"></div>');
      wp2.appendChild(tc);
      wrap.appendChild(wp2);
    }
    app.appendChild(wrap);
  }

  function renderTeamPanel(m, which) {
    var c = cx(m), team = teamOf(m, which);
    var s = which === 1 ? c.sc1 : c.sc2;
    var done = m.status === "done", locked = isLocked(m);
    var hi = done ? m.winner === (which === 1 ? m.team1 : m.team2) : (locked ? false : c.bat === which);
    var canScore = !locked && c.bat === which;
    var label;
    if (done) label = hi ? "Winner" : "Defeated";
    else if (locked) label = "Tied";
    else label = c.bat === which ? "Batting &middot; " + ordinal(c.inn) + " innings" : "Bowling";

    var panel = el('<div class="team-panel ' + (hi ? "batting" : "resting") + ((done ? hi : c.bat === which) ? " wide" : " narrow") + '" data-team="' + which + '"></div>');
    panel.appendChild(el('<div class="bat-indicator"><span class="dot"></span>' + label + "</div>"));
    panel.appendChild(el('<div class="tname" title="' + escapeAttr(team.name) + '">' + logoImg(team, "sm") +
      '<span class="tn-text">' + escapeHtml(team.name) + "</span></div>"));
    panel.appendChild(el('<div class="captain-line">Capt. ' + escapeHtml(team.captain) + "</div>"));
    panel.appendChild(el('<div class="score-num">' + s.runs + '<span class="wkts">/' + s.wickets + "</span></div>"));
    panel.appendChild(el('<div class="rr-line">' + rrText(s, c) + "</div>"));
    var chips = currentOver(s).map(function (b) {
      var cls = b.w ? " w" : (b.l === "4" || b.l === "6") ? " b" : (!b.legal ? " x" : "");
      return '<span class="chip' + cls + '">' + escapeHtml(b.l) + "</span>";
    }).join("");
    panel.appendChild(el('<div class="over-chips">' + (chips ? '<span class="oc-label">This over</span>' + chips : "") + "</div>"));

    function field(labelText, input) {
      var w = el("<div><label>" + labelText + "</label></div>");
      w.appendChild(input);
      return w;
    }
    var before = null;
    var pre = null;
    function wire(input, onInput, autoBall) {
      input.disabled = !canScore;
      input.addEventListener("focus", function () { before = snap(m); pre = { runs: s.runs, wickets: s.wickets, balls: s.balls }; });
      input.addEventListener("input", onInput);
      input.addEventListener("change", function () {
        // typing a higher score / wicket count counts as one delivery, so overs move on their own
        if (autoBall && pre && (s.runs > pre.runs || s.wickets > pre.wickets) && s.balls === pre.balls && s.balls < c.overs * 6) {
          s.balls++;
          s.log = s.log || [];
          s.log.push({ l: s.wickets > pre.wickets ? "W" : String(s.runs - pre.runs), legal: true, w: s.wickets > pre.wickets });
        }
        var b = before; before = null; pre = null; commitEdit(m, b);
      });
    }

    var runsIn = el('<input type="number" min="0" inputmode="numeric" />');
    runsIn.value = s.runs;
    wire(runsIn, function () {
      var v = parseInt(runsIn.value, 10);
      s.runs = isNaN(v) ? 0 : Math.max(0, v);
      paintScores(m);
    }, true);

    var wktsIn = el('<input type="number" min="0" max="' + c.maxW + '" inputmode="numeric" />');
    wktsIn.value = s.wickets;
    wire(wktsIn, function () {
      var v = parseInt(wktsIn.value, 10);
      s.wickets = isNaN(v) ? 0 : Math.min(c.maxW, Math.max(0, v));
      paintScores(m);
    }, true);

    var ovIn = el('<input type="text" class="ov" inputmode="decimal" placeholder="0.0" />');
    ovIn.value = oversText(s.balls);
    wire(ovIn, function () {
      var b = parseOvers(ovIn.value);
      if (b !== null) { s.balls = Math.min(b, c.overs * 6); paintScores(m); }
    });

    var editRow = el('<div class="score-edit"></div>');
    editRow.appendChild(field("Runs", runsIn));
    editRow.appendChild(field("Wickets", wktsIn));
    editRow.appendChild(field("Overs", ovIn));
    panel.appendChild(editRow);

    var modeNames = { wd: "Wide", nb: "No Ball", bye: "Bye", lb: "Leg Bye" };
    var modeHelp = {
      wd: "Wide: tap the runs run off it (+0 = just the wide). 1 penalty run is added and no ball is counted.",
      nb: "No Ball: tap the runs hit off it (+0 = just the no ball). 1 penalty run is added and no ball is counted.",
      bye: "Bye: tap the byes run. The ball is counted.",
      lb: "Leg Bye: tap the leg byes run. The ball is counted."
    };
    var mode = canScore ? extraMode : null;
    var extras = el('<div class="extras-row"></div>');
    ["wd", "nb", "bye", "lb"].forEach(function (k) {
      var eb = el('<button class="extra' + (mode === k ? " on" : "") + '">' + modeNames[k] + "</button>");
      eb.disabled = !canScore;
      eb.onclick = function () { extraMode = extraMode === k ? null : k; refreshMatch(); };
      extras.appendChild(eb);
    });
    panel.appendChild(extras);
    if (mode) panel.appendChild(el('<div class="extra-hint">' + modeHelp[mode] + "</div>"));

    var quick = el('<div class="quick-runs"></div>');
    [0, 1, 2, 3, 4, 6].forEach(function (n) {
      var qb = el("<button>+" + n + "</button>");
      qb.disabled = !canScore;
      qb.onclick = function () {
        var k = extraMode; extraMode = null;
        act(m, function () { deliver(s, c, k, n, false); });
      };
      quick.appendChild(qb);
    });
    var wb = el('<button class="wkt">Wkt</button>');
    wb.disabled = !canScore;
    wb.onclick = function () {
      var k = extraMode; extraMode = null;
      act(m, function () { deliver(s, c, k, 0, true); });
    };
    quick.appendChild(wb);
    panel.appendChild(quick);
    return panel;
  }

  // ----- Champion -----

  function renderChampion() {
    app.innerHTML = "";
    var champ = getTeam(state.champion);
    var finalMatch = state.rounds[state.rounds.length - 1][0];
    var runnerId = finalMatch && !finalMatch.isBye ? (finalMatch.team1 === state.champion ? finalMatch.team2 : finalMatch.team1) : null;
    var runner = getTeam(runnerId);

    var wrap = el('<div class="champion-block view-fade"></div>');
    wrap.appendChild(el('<div class="cup">&#127942;</div>'));
    wrap.appendChild(el('<div class="label">Tournament champion</div>'));
    wrap.appendChild(el('<div class="champ-logo">' + logoImg(champ, "hero") + "</div>"));
    wrap.appendChild(el('<div class="name">' + escapeHtml(champ.name) + "</div>"));
    wrap.appendChild(el('<div class="champ-captain">Captain &middot; <strong>' + escapeHtml(champ.captain) + "</strong></div>"));
    if (runner) {
      wrap.appendChild(el('<div class="champ-sub">Beat ' + escapeHtml(runner.name) + " in the Final &middot; " + escapeHtml(finalMatch.result) + "</div>"));
    }
    wrap.appendChild(el('<div class="champ-event">' + escapeHtml(state.tournament) + (state.org ? " &middot; " + escapeHtml(state.org) : "") + "</div>"));

    var actions = el('<div class="setup-actions" style="justify-content:center;margin-top:6px;flex-wrap:wrap;"></div>');
    var back = el('<button class="btn btn-ghost">View full bracket</button>');
    back.onclick = function () { state.view = "bracket"; render(); };
    var resetBtn = el('<button class="btn btn-ball">Reset &amp; go home</button>');
    resetBtn.onclick = function () { resetTournament(); };
    actions.appendChild(back); actions.appendChild(resetBtn);
    wrap.appendChild(actions);
    app.appendChild(wrap);
  }

  function fireConfetti() {
    var colors = ["#D9A72B", "#F2C94C", "#F9E7AE", "#2DE9FF", "#E2555C", "#F4F1E4"];
    var layer = document.createElement("div");
    layer.className = "confetti-layer";
    document.body.appendChild(layer);
    for (var i = 0; i < 90; i++) {
      var piece = document.createElement("div");
      piece.className = "confetti-piece";
      var size = 6 + Math.random() * 6;
      piece.style.left = (Math.random() * 100) + "vw";
      piece.style.width = size + "px";
      piece.style.height = (size * 0.4 + 3) + "px";
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = (2.6 + Math.random() * 1.8) + "s";
      piece.style.animationDelay = (Math.random() * 0.6) + "s";
      layer.appendChild(piece);
    }
    setTimeout(function () { layer.remove(); }, 5200);
  }

  // Test hook (harmless in normal use)
  window.__cricket = { get state() { return state; }, render: render };

  // ---------------- Live background (canvas): floodlights, pitch, drifting lights, flying balls ----------------

  function initBackdrop() {
    var cv = document.getElementById("liveBg");
    if (!cv || !cv.getContext) return;
    var ctx = cv.getContext("2d");
    var W = 0, H = 0, motes = [], balls = [], nextBall = 1.0, last = 0, clock = 0;
    var PI2 = Math.PI * 2;

    function rnd(a, b) { return a + Math.random() * (b - a); }

    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      motes = [];
      var n = Math.min(90, Math.round(W * H / 16000));
      for (var i = 0; i < n; i++) {
        motes.push({ x: Math.random() * W, y: Math.random() * H, r: rnd(1, 3.2), v: rnd(6, 22), ph: Math.random() * PI2,
          c: Math.random() < 0.6 ? "45,233,255" : "242,201,76" });
      }
      if (reduceMotion) frame(3, 0);
    }

    function beam(x0, ang, len, spread, alpha) {
      var x1 = x0 + Math.sin(ang) * len, y1 = Math.cos(ang) * len;
      var px = Math.cos(ang) * spread, py = -Math.sin(ang) * spread;
      var g = ctx.createLinearGradient(x0, 0, x1, y1);
      g.addColorStop(0, "rgba(190,225,255," + alpha + ")");
      g.addColorStop(1, "rgba(190,225,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(x0, -10); ctx.lineTo(x1 - px, y1 - py); ctx.lineTo(x1 + px, y1 + py); ctx.closePath(); ctx.fill();
    }

    function field(t) {
      var vx = W / 2, vy = H * 0.58;
      ctx.save();
      ctx.beginPath(); ctx.ellipse(W / 2, H * 1.08, W * 0.78, H * 0.52, 0, 0, PI2); ctx.clip();
      var g = ctx.createLinearGradient(0, H * 0.56, 0, H);
      g.addColorStop(0, "rgba(22,120,96,0.10)"); g.addColorStop(1, "rgba(18,135,104,0.40)");
      ctx.fillStyle = g; ctx.fillRect(0, H * 0.5, W, H);
      // mowing stripes rolling toward the viewer, in perspective
      var N = 14, ph = (t * 0.35) % 2;
      ctx.fillStyle = "rgba(255,255,255,0.05)";
      for (var k = -2; k <= N; k++) {
        if (((k % 2) + 2) % 2) continue;
        var u0 = Math.max(0, (k - ph) / N), u1 = Math.min(1, (k + 1 - ph) / N);
        if (u1 <= u0) continue;
        var y0 = vy + (H - vy) * u0 * u0, y1 = vy + (H - vy) * u1 * u1;
        ctx.fillRect(0, y0, W, y1 - y0 + 1);
      }
      // the pitch strip
      var tw = W * 0.03, bw = W * 0.17;
      var pg = ctx.createLinearGradient(0, vy, 0, H);
      pg.addColorStop(0, "rgba(214,190,130,0.10)"); pg.addColorStop(1, "rgba(214,190,130,0.26)");
      ctx.fillStyle = pg;
      ctx.beginPath(); ctx.moveTo(vx - tw, vy); ctx.lineTo(vx + tw, vy); ctx.lineTo(vx + bw, H); ctx.lineTo(vx - bw, H); ctx.closePath(); ctx.fill();
      // creases
      ctx.strokeStyle = "rgba(255,255,255,0.22)"; ctx.lineWidth = 1.5;
      [0.12, 0.86].forEach(function (u) {
        var y = vy + (H - vy) * u, hw = tw + (bw - tw) * u;
        ctx.beginPath(); ctx.moveTo(vx - hw, y); ctx.lineTo(vx + hw, y); ctx.stroke();
      });
      // boundary rope
      ctx.setLineDash([10, 8]); ctx.strokeStyle = "rgba(255,255,255,0.16)"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(W / 2, H * 1.08, W * 0.78, H * 0.52, 0, Math.PI, PI2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
      // stumps glowing at the far end
      var sy = vy + (H - vy) * 0.12, sh = Math.max(16, H * 0.035), sp = Math.max(4, W * 0.004);
      ctx.save();
      ctx.shadowColor = "rgba(242,201,76,0.8)"; ctx.shadowBlur = 14;
      ctx.strokeStyle = "rgba(249,231,174,0.9)"; ctx.lineWidth = 2; ctx.lineCap = "round";
      for (var s = -1; s <= 1; s++) { ctx.beginPath(); ctx.moveTo(vx + s * sp, sy); ctx.lineTo(vx + s * sp, sy - sh); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(vx - sp * 1.4, sy - sh); ctx.lineTo(vx - sp * 0.1, sy - sh);
      ctx.moveTo(vx + sp * 0.1, sy - sh); ctx.lineTo(vx + sp * 1.4, sy - sh); ctx.stroke();
      ctx.restore();
    }

    function spawnBall() {
      var ltr = Math.random() < 0.5;
      balls.push({
        x0: ltr ? -40 : W + 40, x1: ltr ? W + 40 : -40,
        y0: H * rnd(0.55, 0.82), y1: H * rnd(0.5, 0.8), h: H * rnd(0.32, 0.6),
        dur: rnd(2.4, 3.6), t: 0, rot: 0, spin: rnd(6, 11) * (ltr ? 1 : -1), trail: []
      });
    }

    function drawBall(b) {
      var p = b.t / b.dur;
      var x = b.x0 + (b.x1 - b.x0) * p;
      var y = b.y0 + (b.y1 - b.y0) * p - 4 * b.h * p * (1 - p);
      var r = 10 + 6 * Math.sin(Math.PI * p);
      b.trail.push({ x: x, y: y, r: r });
      if (b.trail.length > 22) b.trail.shift();
      for (var i = 0; i < b.trail.length; i++) {
        var q = b.trail[i], f = i / b.trail.length;
        ctx.fillStyle = "rgba(255,92,114," + (f * 0.22).toFixed(3) + ")";
        ctx.beginPath(); ctx.arc(q.x, q.y, q.r * f * 0.9, 0, PI2); ctx.fill();
      }
      ctx.save();
      ctx.translate(x, y); ctx.rotate(b.rot);
      ctx.shadowColor = "rgba(255,92,114,0.8)"; ctx.shadowBlur = 20;
      var g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
      g.addColorStop(0, "#ff8a99"); g.addColorStop(1, "#b81f38");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, PI2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = 1.4; ctx.setLineDash([2, 2.2]);
      ctx.beginPath(); ctx.arc(-r * 1.05, 0, r * 0.95, -0.85, 0.85); ctx.stroke();
      ctx.beginPath(); ctx.arc(r * 1.05, 0, r * 0.95, Math.PI - 0.85, Math.PI + 0.85); ctx.stroke();
      ctx.restore();
    }

    function frame(t, dt) {
      ctx.clearRect(0, 0, W, H);
      // floodlight beams sweeping gently
      ctx.globalCompositeOperation = "lighter";
      beam(W * 0.10, 0.30 + Math.sin(t * 0.30) * 0.16, H * 1.25, W * 0.07, 0.14);
      beam(W * 0.50, Math.sin(t * 0.22 + 1.2) * 0.22, H * 1.3, W * 0.06, 0.09);
      beam(W * 0.90, -0.30 + Math.sin(t * 0.26 + 2.4) * 0.16, H * 1.25, W * 0.07, 0.14);
      // horizon glow
      var hg = ctx.createRadialGradient(W / 2, H * 0.58, 0, W / 2, H * 0.58, W * 0.5);
      hg.addColorStop(0, "rgba(45,233,255,0.12)"); hg.addColorStop(1, "rgba(45,233,255,0)");
      ctx.fillStyle = hg; ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = "source-over";

      field(t);

      // drifting stadium lights
      ctx.globalCompositeOperation = "lighter";
      for (var i = 0; i < motes.length; i++) {
        var m = motes[i];
        m.y -= m.v * dt; m.x += Math.sin(t * 0.5 + m.ph) * 4 * dt;
        if (m.y < -10) { m.y = H + 10; m.x = Math.random() * W; }
        var a = 0.22 + 0.22 * Math.sin(t * 1.6 + m.ph);
        ctx.fillStyle = "rgba(" + m.c + "," + a.toFixed(3) + ")";
        ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, PI2); ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";

      // flying cricket balls
      if (!reduceMotion) {
        nextBall -= dt;
        if (nextBall <= 0 && balls.length < 2) { spawnBall(); nextBall = rnd(2.2, 4.8); }
        for (var j = balls.length - 1; j >= 0; j--) {
          var b = balls[j];
          b.t += dt; b.rot += b.spin * dt;
          if (b.t >= b.dur) { balls.splice(j, 1); continue; }
          drawBall(b);
        }
      }
    }

    function loop(now) {
      var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
      last = now; clock += dt;
      // only animate on the first page; other pages have no background, so no work is done
      if (document.body.getAttribute("data-view") === "tournament") {
        try { frame(clock, dt); } catch (e) { /* never let drawing break the app */ }
      }
      requestAnimationFrame(loop);
    }

    window.addEventListener("resize", resize);
    resize();
    if (!reduceMotion) requestAnimationFrame(loop);
  }

  load();
  render();
  try { initBackdrop(); } catch (e) { /* the app works without the animated background */ }
})();
</script>
</body>
</html>
